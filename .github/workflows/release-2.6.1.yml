name: Release 2.6.1

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/release-2.6.1.yml

permissions:
  contents: write

concurrency:
  group: release-2.6.1
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Publish Horde CalDAV fix release
        uses: actions/github-script@v7
        with:
          script: |
            const tag = '2.6.1';
            const repo = {owner: context.repo.owner, repo: context.repo.repo};
            try {
              await github.rest.repos.getReleaseByTag({...repo, tag});
              core.info(`Release ${tag} already exists; nothing to do.`);
              return;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            await github.rest.repos.createRelease({
              ...repo,
              tag_name: tag,
              target_commitish: context.sha,
              name: tag,
              draft: false,
              prerelease: false,
              body: [
                '## Fixes',
                '- Fix DAVx5/Horde CalDAV HTTP 500 errors when calendar descriptions contain four-byte Unicode characters.',
                '- Configure the deployed Horde SQL connection for utf8mb4.',
                '- Convert kronolith_events and horde_alarms when their character columns are not already utf8mb4.',
                '',
                '## Deployment notes',
                '- Back up the Horde database before the first migration and allow for table rebuilds/locks.',
                '- Unrelated Horde tables are unchanged.',
                '- The equivalent manual fix was verified on AlmaLinux 8; the Ansible automation has not been deployment-tested.',
                '- The existing utf-8 template setting is overridden by a subsequent task; repeat deployments may report configuration changes.',
                '',
                'PR: https://github.com/suhancz/ansible-mailserver/pull/63',
                'Full changelog: https://github.com/suhancz/ansible-mailserver/compare/2.6...2.6.1'
              ].join('\n')
            });
