---
name: Test user names

on:
  push:
    paths:
      - tasks/misc/normalize_users.yml
      - library/**
      - tests/normalize_users.yml
      - .github/workflows/test-users.yml
  pull_request:
    paths:
      - tasks/misc/normalize_users.yml
      - library/**
      - tests/normalize_users.yml
      - .github/workflows/test-users.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  normalize-users:
    name: User name derivation on AlmaLinux 8
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
      - name: Run the tests in a minimal AlmaLinux 8 container
        # ansible-core runs on Python 3.9, the modules run on the system Python 3.6 of EL8,
        # just like on the real server
        run: |
          docker run --rm -v "$PWD:/role:ro" -w /role almalinux:8-minimal bash -euxc '
            microdnf -y install python39 python39-pip dnf
            pip3.9 install "ansible-core>=2.15,<2.17"
            export ANSIBLE_LIBRARY=library
            export ANSIBLE_FORCE_COLOR=1
            ansible-playbook -i localhost, -c local \
              -e ansible_python_interpreter=/usr/libexec/platform-python \
              tests/normalize_users.yml
          '
