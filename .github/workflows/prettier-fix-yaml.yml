---
name: Fix YAML formatting (temporary)

# Temporary workflow. It starts only when this file is pushed, runs the
# Prettier fixer of Super-Linter once over the YAML files (the same Prettier
# configuration as the lint job) and commits the changed YAML files to the
# branch. Delete this file after the run.

on: # yamllint disable-line rule:truthy
  push:
    branches: [feature/kolab]
    paths: [.github/workflows/prettier-fix-yaml.yml]

permissions: {}

concurrency:
  group: prettier-fix-yaml
  cancel-in-progress: false

jobs:
  fix:
    name: Run the Prettier fixer and commit the result
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: write
    steps:
      - name: Check out the branch
        uses: actions/checkout@main # zizmor: ignore[unpinned-uses]
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fix the YAML formatting with Super-Linter
        uses: super-linter/super-linter@latest # zizmor: ignore[unpinned-uses]
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BRANCH: main
          VALIDATE_ALL_CODEBASE: true
          VALIDATE_YAML_PRETTIER: true
          FIX_YAML_PRETTIER: true
          ENABLE_GITHUB_PULL_REQUEST_SUMMARY_COMMENT: false
      - name: Commit the formatted YAML files and start the lint workflow
        shell: bash
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Super-Linter runs as root and leaves its files owned by root
          sudo chown -R "$(id -u):$(id -g)" .
          git add -u
          echo 'Changed files:'
          git diff --cached --name-only
          if git diff --cached --quiet; then
            echo 'Nothing to commit.'
            exit 0
          fi
          if git diff --cached --name-only | grep -v -E '\.ya?ml$'; then
            echo 'Only YAML files may change; stopping.' >&2
            exit 1
          fi
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m 'Format the YAML files with Prettier'
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push "$remote" "HEAD:refs/heads/$TARGET_BRANCH"
          # Pushes with the workflow token start no workflows, so start them
          gh workflow run linter.yml --repo "$GITHUB_REPOSITORY" --ref "$TARGET_BRANCH"
          gh workflow run tests.yml --repo "$GITHUB_REPOSITORY" --ref "$TARGET_BRANCH" || echo 'tests.yml cannot be started by hand'
