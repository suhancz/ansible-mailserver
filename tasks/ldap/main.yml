- name: Clean up former migration attempts
  ansible.builtin.file:
    path: "/var/tmp/{{ migration_file }}"
    state: absent
  loop:
    - passwd.mig
    - group.mig
    - shadow.mig
    - gshadow.mig
    - group.ldif
    - passwd.ldif
  loop_control:
    loop_var: migration_file
- name: Set variable for ldapadd command parameters
  ansible.builtin.set_fact:
    ldapadd_command: 'ldapadd -c -x -h {{ mailserver_domain }} -D "cn=Directory Manager" -w "{{ ldap_admin_password }}" -f '
  no_log: true
- name: Deploy user data extraction script
  ansible.builtin.copy:
    src: files/ldap/extract_user_data_to_migrate.sh
    dest: /var/tmp/
    mode: u=rwx,og=rx
    backup: yes
    force: yes
    owner: root
    group: root
- name: Extract user data from the OS
  ansible.builtin.command: /var/tmp/extract_user_data_to_migrate.sh
- name: "Update LDAP entries: {{ user_data_item }}"
  ansible.builtin.include_tasks: ldap/convert_user_to_ldif.yml
  loop: "{{ users }}"
  loop_control:
    loop_var: user_data_item

- name: Add Kolab users
  no_log: true
  tags:
    - users
  block:
    - name: "Add user to Kolab: {{ user.name }}"
      ansible.builtin.include_tasks: kolab/add_kolab_user.yml
      loop: "{{ users }}"
      loop_control:
        loop_var: user
  rescue:
    - name: Authenticate against the Kolab API
      ansible.builtin.include_tasks: kolab/kolab_auth.yml
    - name: "Add user to Kolab: {{ user.name }}"
      ansible.builtin.include_tasks: kolab/add_kolab_user.yml
      loop: "{{ users }}"
      loop_control:
        loop_var: user
- name: Set admin user group membership
  ansible.builtin.include_tasks: ldap/add_admin_user_to_ldap_groups.yml
  loop:
    - "cn=Directory Administrators,dc={{ mailserver_domain | split('.') | join(',dc=') }}"
    - "cn=Accounting Managers,ou=groups,dc={{ mailserver_domain | split('.') | join(',dc=') }}"
    - "cn=HR Managers,ou=groups,dc={{ mailserver_domain | split('.') | join(',dc=') }}"
    - "cn=QA Managers,ou=groups,dc={{ mailserver_domain | split('.') | join(',dc=') }}"
    - "cn=PD Managers,ou=groups,dc={{ mailserver_domain | split('.') | join(',dc=') }}"
  loop_control:
    loop_var: group_dn
- name: Prepare LDIF to LDAP admin access
  ansible.builtin.template:
    src: ldap/fix_domain_aci.ldif.j2
    dest: /var/tmp/fix_domain_aci.ldif
    mode: u=rw,og=r
    owner: root
    group: root
    backup: yes
- name: LDAP admin access
  ansible.builtin.command: 'ldapmodify -c -x -h {{ mailserver_domain }} -D "cn=Directory Manager" -w "{{ ldap_admin_password }}" -f /var/tmp/fix_domain_aci.ldif'
  no_log: true
  register: fix_domain_access
  changed_when: fix_domain_access.rc == 0
  failed_when: fix_domain_access.rc != 0 and 'exists' not in fix_domain_access.stderr
