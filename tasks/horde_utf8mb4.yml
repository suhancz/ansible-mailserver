---
# Back up the Horde database before first deployment; ALTER TABLE may rebuild/lock tables.
# Scope this migration to the two tables involved in the verified CalDAV failure.
- name: Configure Horde SQL connection for four-byte Unicode
  ansible.builtin.lineinfile:
    path: /etc/horde/conf.php
    regexp: '^\$conf\[''sql''\]\[''charset''\]\s*='
    line: "$conf['sql']['charset'] = 'utf8mb4';"
    backup: yes
  notify: Restart php-fpm

- name: Inspect Horde calendar and alarm column character sets
  community.mysql.mysql_query:
    login_db: horde
    login_user: root
    login_password: '{{ mysql_root_password }}'
    query: >-
      SELECT DISTINCT TABLE_NAME AS table_name
      FROM information_schema.COLUMNS
      WHERE TABLE_SCHEMA = 'horde'
        AND TABLE_NAME IN ('kronolith_events', 'horde_alarms')
        AND CHARACTER_SET_NAME IS NOT NULL
        AND CHARACTER_SET_NAME <> 'utf8mb4'
      ORDER BY TABLE_NAME
  register: horde_utf8mb4_tables
  changed_when: false
  no_log: yes
  when: not ansible_check_mode

- name: Convert Horde calendar and alarm tables to four-byte Unicode
  community.mysql.mysql_query:
    login_db: horde
    login_user: root
    login_password: '{{ mysql_root_password }}'
    query: >-
      ALTER TABLE `{{ item.table_name }}`
      CONVERT TO CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci
  loop: '{{ (horde_utf8mb4_tables.query_result | default([[]]))[0] }}'
  loop_control:
    label: '{{ item.table_name }}'
  no_log: yes
  when: not ansible_check_mode
