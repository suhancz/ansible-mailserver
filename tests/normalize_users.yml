---
# Tests for tasks/misc/normalize_users.yml
# The role is loaded with include_role, exactly as in a real run, so the files of
# the role are found. Every case runs on its own (local) host, because facts set
# with set_fact stay on a host and would leak into the next play. Run it with the
# repository available as a role called ansible_mailserver
# (see .github/workflows/test-users.yml):
#   ANSIBLE_ROLES_PATH=/roles ansible-playbook -i case_family,case_plain,case_missing, -c local -e mailserver_no_log=false tests/normalize_users.yml
- name: Usernames in family mode
  hosts: case_family
  connection: local
  gather_facts: false
  vars:
    family_mode: true
    users:
      - firstname: Ákos
        surname: Kovács
        password: secret
      - firstname: Αλέξανδρος
        password: secret
      - firstname: 北京
        password: secret
      - firstname: Mary Ann
        password: secret
      - firstname: O'Neil
        password: secret
      - name: tigris
        firstname: Hobbes
        password: secret
  tasks:
    - name: Derive the usernames
      ansible.builtin.include_role:
        name: ansible_mailserver
        tasks_from: misc/normalize_users.yml
    - name: Check the derived usernames
      ansible.builtin.assert:
        that:
          - users | map(attribute='name') | list == ['akos', 'alexandros', 'beijing', 'maryann', 'oneil', 'tigris']

- name: Usernames without family mode
  hosts: case_plain
  connection: local
  gather_facts: false
  vars:
    family_mode: false
    users:
      - firstname: Ákos
        surname: Kovács
        password: secret
      - firstname: Юрий
        surname: Щербаков
        password: secret
      - firstname: Zoë
        surname: O'Brien
        password: secret
      - name: tigris
        password: secret
  tasks:
    - name: Derive the usernames
      ansible.builtin.include_role:
        name: ansible_mailserver
        tasks_from: misc/normalize_users.yml
    - name: Check the derived usernames
      ansible.builtin.assert:
        that:
          - users | map(attribute='name') | list == ['akovacs', 'yushcherbakov', 'zobrien', 'tigris']

- name: A missing surname must be rejected without family mode
  hosts: case_missing
  connection: local
  gather_facts: false
  vars:
    family_mode: false
    users:
      - firstname: Akos
        password: secret
  tasks:
    - name: Try to derive the usernames
      block:
        - name: Derive the usernames
          ansible.builtin.include_role:
            name: ansible_mailserver
            tasks_from: misc/normalize_users.yml
        - name: This must not be reached
          ansible.builtin.fail:
            msg: The derivation should have failed because of the missing surname
      rescue:
        - name: Check that the right check failed
          ansible.builtin.assert:
            that:
              - ansible_failed_task.name == 'Check that every user has enough data to derive a username'
